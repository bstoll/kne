---
name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    uses: openconfig/common-ci/.github/workflows/go.yml@7f89b8080a6ded96e2e0c7db9184f810aa1bf260
    with:
      coverage-excludes-regex: /cloudbuild
      tests-excludes-regex: /cloudbuild
      race-tests-excludes-regex: /cloudbuild
      skip-race-tests: true
      go-versions: "['1.21']"

  linter:
    uses: openconfig/common-ci/.github/workflows/linter.yml@7f89b8080a6ded96e2e0c7db9184f810aa1bf260
